baseURL = "https://go-commonmark.github.io/"
languageCode = "en-us"
title = "go-commonmark"
disableKinds = ["taxonomy", "term", "RSS", "sitemap"]

# The design comes from the landing kit, a Hugo module pinned in go.mod.
[module]
  [[module.imports]]
    path = "github.com/go-fleettools/landingkit"

[params.brand]
# Generated by go-fleettools/landingkit from static/favicon.svg: the colours are
# READ from the logo's gradient, never chosen. Do not add other keys:
# neutrals (backgrounds, surfaces, greys) belong to the shared sheet.
# Contrast: base on white 17.85:1, bright on the dark background 2.55:1.
  base = "#0f172a"
  deep = "#090e1a"
  bright = "#475569"
  shadow = "rgba(15,23,42,.7)"
  glow = "rgba(15,23,42,.6)"
  wash = "rgba(15,23,42,.10)"
  washDeep = "rgba(9,14,26,.06)"
  chipBg = "#e9ebed"
  chipBorder = "#c8ccd2"
  chipFg = "#090e1a"
  chipBgDark = "rgba(71,85,105,.14)"
  chipBorderDark = "rgba(71,85,105,.32)"
  chipFgDark = "#9aa2ac"
  statsEnd = "#d3d6db"
  bandText = "#e2e4e7"
  accent = "#0f172a"
  accentDark = "#737e8d"

# The hero's buttons, rendered by landingkit's cta.html in the kit's order.
[[params.cta]]
  kind  = "docs"
  href  = "https://go-commonmark.github.io/docs/"
  label = "Documentation"
[[params.cta]]
  kind  = "github"
  href  = "https://github.com/go-commonmark"
  label = "GitHub"
